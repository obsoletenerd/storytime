<!doctype html><html lang="en" class="hf-root" data-hf-theme="auto"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Storytime{% endblock %}</title><link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}"><link rel="stylesheet" href="{{ config.HOMEFRAME_URL }}/homeframe.css"><link rel="stylesheet" href="{{ config.HOMEFRAME_URL }}/themes/eucalyptus-glass.css"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="hf-page"><header class="hf-topbar"><a class="hf-brand storytime-brand" href="{{ url_for('index') }}">✦ Storytime</a><nav class="hf-nav" aria-label="Primary navigation"><a class="hf-nav__link" href="{{ url_for('index') }}">Bookshelf</a><a class="hf-nav__link" href="{{ url_for('new_book') }}">New Book</a></nav></header>{% with messages = get_flashed_messages() %}{% if messages %}<div class="hf-container" role="status">{% for message in messages %}<p class="hf-alert hf-alert--warning">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}<footer class="storytime-footer hf-container"><p class="hf-text-small hf-text-muted">Made for cozy nights · <a href="https://github.com/obsoletenerd/Storytime">Source code</a></p></footer><script defer src="{{ config.HOMEFRAME_URL }}/homeframe.js"></script></body></html>
