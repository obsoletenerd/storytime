{% extends "base.html" %}{% block title %}Write Chapter {{ next_number }} · Storytime{% endblock %}{% block content %}<main class="hf-container hf-container--reading hf-page-main hf-stack"><header><p class="hf-eyebrow">{{ book.title }}</p><h1>Write Chapter {{ next_number }}</h1><p>{{ book.premise }}</p></header><section class="hf-card"><h2>Last time…</h2><p class="latest-excerpt">{{ latest.content[-900:] }}</p><form class="hf-form" action="{{ url_for('create_chapter', book_id=book.id) }}" method="post"><label class="hf-label" for="guidance">What should happen next?</label><textarea class="hf-input" id="guidance" name="guidance" rows="5" maxlength="4000" placeholder="Include a mysterious lighthouse and let Rex solve the puzzle…"></textarea><label class="hf-label" for="provider">Storyteller</label><select class="hf-select" id="provider" name="provider" required>{% for key, provider in providers.items() %}<option value="{{ key }}" {% if key == book.preferred_provider %}selected{% endif %}>{{ provider.display_name }}</option>{% endfor %}</select><button class="hf-button hf-button--primary" type="submit">Generate Chapter {{ next_number }} →</button></form></section></main>{% endblock %}
