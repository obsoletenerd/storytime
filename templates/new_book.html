{% extends "base.html" %}{% block title %}New Book · Storytime{% endblock %}{% block content %}<main class="hf-container hf-container--reading hf-page-main hf-stack"><header><p class="hf-eyebrow">A new adventure</p><h1>Create a book</h1><p>Choose the ingredients for Chapter 1.</p></header><section class="hf-card"><form class="hf-form" action="{{ url_for('create_book') }}" method="post" enctype="multipart/form-data"><label class="hf-label" for="format">Story format</label><select class="hf-select" id="format" name="format"><option value="ongoing">Ongoing book — add chapters later</option><option value="standalone">Standalone story — complete in one part</option></select><label class="hf-label" for="title">Book title (optional)</label><input class="hf-input" id="title" name="title" placeholder="Let Storytime choose a title"><label class="hf-label" for="characters">Characters</label><textarea class="hf-input" id="characters" name="characters" rows="3" required placeholder="Lucy (9), Rex the curious dog…"></textarea><label class="hf-label" for="themes">Favourite things and themes</label><textarea class="hf-input" id="themes" name="themes" rows="2" placeholder="Dinosaurs, puzzles, friendship…"></textarea><label class="hf-label" for="premise">Setting or adventure idea</label><textarea class="hf-input" id="premise" name="premise" rows="3" required placeholder="A hidden lighthouse on a misty island…"></textarea><label class="hf-label" for="reader_notes">Reader age or other notes (optional)</label><input class="hf-input" id="reader_notes" name="reader_notes" placeholder="For a 9-year-old; keep it cosy"><label class="hf-label" for="provider">Storyteller</label><select class="hf-select" id="provider" name="provider" required>{% for key, provider in providers.items() %}<option value="{{ key }}">{{ provider.display_name }}</option>{% endfor %}</select><label class="hf-label" for="cover_choice">Cover</label><select class="hf-select" id="cover_choice" name="cover_choice"><option value="none">Use a placeholder for now</option><option value="upload">Upload my own cover</option><option value="generate">Generate a cover with OpenAI ($)</option></select><label class="hf-label" for="cover">Cover image (for upload option)</label><input class="hf-input" type="file" id="cover" name="cover" accept="image/png,image/jpeg,image/webp"><button class="hf-button hf-button--primary" type="submit">Create book and first chapter →</button></form></section></main>{% endblock %}
