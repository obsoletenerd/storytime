{% extends "base.html" %} {% block title %}Creating your story · Storytime{% endblock %} {% block content %}
<main class="hf-container hf-container--reading hf-page-main">
    <section class="hf-card storytime-wait" aria-live="polite">
        <div class="storytime-wait__icon" aria-hidden="true">✦</div>
        <p class="hf-eyebrow">The story is beginning</p>
        <h1>Gathering a little moonlight…</h1>
        <p class="hf-text-muted" id="status">Your storyteller is choosing the characters, surprises, and a very satisfying ending.</p>
        <div class="hf-progress" aria-hidden="true"><span class="hf-progress__bar storytime-progress-bar"></span></div>
        <span class="hf-spinner" aria-hidden="true"></span>
    </section>
</main>
<script>
    fetch('{{ url_for("generate") }}', { method: "POST" })
        .then((resp) => resp.json())
        .then(() => { window.location.href = '{{ url_for("result") }}'; })
        .catch((err) => {
            document.getElementById("status").textContent = "We hit a snag while making the story: " + err;
        });
</script>
{% endblock %}
